name: Import WeChat Article

on:
  issues:
    types: [opened, labeled]

permissions:
  contents: write
  issues: write

jobs:
  import-article:
    if: contains(github.event.issue.labels.*.name, 'wechat-import')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements-wechat.txt

      - name: Extract URL from issue
        id: extract-url
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          URL=$(python - <<'PY'
          import os
          import re

          body = os.environ["ISSUE_BODY"]
          urls = re.findall(r'https?://\S+', body)
          print(urls[0] if urls else '')
          PY
          )
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Import article
        run: python scripts/wechat_to_post.py "${{ steps.extract-url.outputs.url }}"

      - name: Push generated post
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _posts images/wechat
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Import WeChat article from issue #${{ github.event.issue.number }}"
          git push

      - name: Close issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue close "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --comment "已导入公众号文章。"
